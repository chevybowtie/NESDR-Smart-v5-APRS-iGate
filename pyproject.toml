[build-system]
requires = ["setuptools>=69", "build>=1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-rx"
version = "0.5.0"
description = "Neo-RX multi-mode radio toolkit (APRS, WSPR, ADS-B, telemetry)"
authors = [{ name = "Paul Sturm" }]
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
keywords = ["aprs", "igate", "wspr", "adsb", "sdr", "rtl-sdr", "ham-radio", "flight-tracker"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Operating System :: POSIX :: Linux",
	"Topic :: Communications :: Ham Radio"
]
dependencies = [
	"neo-core==0.5.0",
	"neo-aprs==0.5.0",
	"neo-wspr==0.5.0",
	"neo-adsb==0.5.0",
	"neo-telemetry==0.5.0",
]

[project.urls]
Homepage = "https://github.com/chevybowtie/NESDR-Smart-v5-APRS-iGate"

[project.scripts]
neo-rx = "neo_core.cli:main"
neo-rx-next = "neo_core.cli:main"

[project.optional-dependencies]
dev = [
	"pytest>=9.0",
	"pytest-asyncio>=1.0",
	"pytest-cov>=7.0",
	"pytest-rerunfailures>=16.0",
	"black>=25.0",
	"mypy>=1.15",
	"ruff>=0.14",
	"coverage[toml]>=7.12",
	"twine>=6.0",
	"build>=1.3",
]
direwolf = [
	"neo-aprs[direwolf]==0.5.0",
]
all = [
	"neo-aprs[direwolf]==0.5.0",
	"neo-adsb==0.5.0",
]
adsb = [
	"neo-adsb==0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "neo_rx",
    "neo_rx._compat",
    "neo_rx.aprs",
    "neo_rx.commands",
    "neo_rx.radio",
    "neo_rx.telemetry",
    "neo_rx.templates",
    "neo_rx.wspr",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:pkg_resources is deprecated:UserWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
